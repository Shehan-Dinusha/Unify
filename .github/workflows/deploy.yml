name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test "tests/**/*.test.js"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/unify-backend:${{ github.sha }}
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/unify-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image names
        id: vars
        shell: bash
        run: |
          REGISTRY_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "registry_owner=$REGISTRY_OWNER" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/$REGISTRY_OWNER/unify-backend:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "server_image=ghcr.io/$REGISTRY_OWNER/unify-server:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.vars.outputs.backend_image }}
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/unify-backend:latest
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          tags: |
            ${{ steps.vars.outputs.server_image }}
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/unify-server:latest
      - name: Copy files to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          source: "docker-compose.lightsail.yml,deploy.lightsail.sh"
          target: "/home/ubuntu/Unify"
      - name: Deploy stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          command_timeout: 40m
          script: |
            cd /home/ubuntu/Unify
            chmod +x deploy.lightsail.sh
            BACKEND_IMAGE=${{ steps.vars.outputs.backend_image }} \
            SERVER_IMAGE=${{ steps.vars.outputs.server_image }} \
            GHCR_USERNAME=${{ secrets.GHCR_USERNAME }} \
            GHCR_TOKEN=${{ secrets.GHCR_PULL_TOKEN }} \
            bash deploy.lightsail.sh
