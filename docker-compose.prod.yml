services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unify-backend
    restart: always
    expose:
      - "5000"
    env_file: .env
    environment:
      - NODE_ENV=production
    networks:
      - unify-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: unify-server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - unify-network

  certbot:
    image: certbot/certbot
    container_name: unify-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c '
        if [ ! -d /etc/letsencrypt/live/unify-social.app ]; then
          certbot certonly --webroot -w /var/www/certbot
            -d unify-social.app -d api.unify-social.app
            --email admin@unify-social.app --agree-tos --non-interactive
            --register-unsafely-without-email || true
        fi
        trap exit TERM
        while :; do
          certbot renew --deploy-hook "kill -s HUP 1"
          sleep 12h & wait $${!}
        done
      '
    depends_on:
      - server

networks:
  unify-network:
    driver: bridge

volumes:
  certbot-www:
