version: "3.8"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: unify-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-Unify}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unify-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-Unify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Express + Sequelize) ────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: unify-backend
    init: true
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    env_file: ./backend/.env
    environment:
      # - DB_HOST=postgres
      # - DB_PORT=5432
      # - DB_SSL=false
      - NODE_ENV=development
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - unify-network

  # ── Frontend (React + Vite) ──────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: unify-frontend
    restart: always
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - unify-network

volumes:
  postgres_data:

networks:
  unify-network:
    driver: bridge
